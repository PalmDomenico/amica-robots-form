<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accesso · Amica Robot Events</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="login-body">
  <main class="login-wrap">
    <div class="login-card">
      <div class="brand brand-lg">
        <div>
          <strong>Amica</strong>
          <span>Robot Events</span>
        </div>
      </div>
      <h1>Accedi</h1>
      <p class="muted">Inserisci le tue credenziali per inviare i log dei robot alla piattaforma.</p>

      <form id="login-form" novalidate>
        <label class="field">
          <span>Username</span>
          <input type="text" name="username" id="username" autocomplete="username" required autofocus />
        </label>
        <label class="field">
          <span>Password</span>
          <div class="input-group">
            <input type="password" name="password" id="password" autocomplete="current-password" required />
            <button type="button" class="btn btn-ghost btn-sm" id="toggle-pw" aria-label="Mostra password">Mostra</button>
          </div>
        </label>
        <div id="login-error" class="alert alert-error" hidden></div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entra</button>
      </form>
    </div>
    <p class="login-foot muted">Accesso riservato al personale autorizzato.</p>
  </main>
  <script src="/static/js/login.js"></script>
</body>
</html>
